name: Temporary approved portfolio deployment

on:
  push:
    branches:
      - deploy-approved-ai-data-20260828

permissions:
  contents: write

jobs:
  deploy-approved-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct approved index
        shell: bash
        run: |
          python - <<'PY'
          import base64, bz2, hashlib
          from pathlib import Path
          chunks = [
          "",""
          ]
          data = bz2.decompress(base64.b64decode(''.join(chunks)))
          expected = 'fbef048b73fa2193fae298c78a7c810e5651a2a5a201fdf2ba080c68bdad9b41'
          actual = hashlib.sha256(data).hexdigest()
          if actual != expected:
              raise SystemExit(f'Integrity check failed: {actual}')
          Path('index.html').write_bytes(data)
          PY
      - name: Commit approved deployment and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/deploy-approved-ai-data-temp.yml
          git commit -m "Deploy approved portfolio AI/Data integration"
          git push origin HEAD:deploy-approved-ai-data-20260828
